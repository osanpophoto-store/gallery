<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>人への感謝、収穫への感謝 | おさんぽフォト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FBF8F2;
  --white: #FFFFFF;
  --sand: #E8E2D6;
  --bark: #7A7A7A;
  --deep: #2C2C2C;
  --forest: #4A7A5A;
  --moss: #7AAD8A;
  --accent: #D4723A;
  --radius: 14px;
  --shadow: 0 6px 28px rgba(44,44,44,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-weight: 500;
  background: var(--paper);
  color: var(--deep);
  line-height: 1.95;
  -webkit-font-smoothing: antialiased;
}
img { display: block; width: 100%; height: auto; }
a { color: inherit; }

/* ヘッダー */
.site-header {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: rgba(251,248,242,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--sand);
}
.brand { font-size: 13px; letter-spacing: 0.08em; color: var(--forest); font-weight: 700; text-decoration: none; }
.header-cta {
  font-size: 12px; font-weight: 700; text-decoration: none;
  color: #fff; background: var(--forest);
  padding: 7px 14px; border-radius: 999px;
}

/* ヒーロー */
.hero { max-width: 760px; margin: 0 auto; padding: 28px 16px 8px; }
.hero-photo { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: var(--sand); }
.hero-photo.ar-54 img { aspect-ratio: 5 / 4; object-fit: cover; }
.hero-photo.ar-43 img { aspect-ratio: 4 / 3; object-fit: cover; }
.eyebrow { margin-top: 22px; font-size: 12px; letter-spacing: 0.18em; color: var(--accent); font-weight: 700; }
h1 {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: clamp(26px, 6.4vw, 36px);
  line-height: 1.5; font-weight: 700; margin-top: 6px; letter-spacing: 0.04em;
}
.meta { margin-top: 8px; font-size: 13px; color: var(--bark); }

/* 本文 */
article { max-width: 680px; margin: 0 auto; padding: 8px 16px 40px; }
.lead { font-size: 16px; margin-top: 18px; }
.chapter { margin-top: 48px; }
.chapter h2 {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 21px; font-weight: 700; line-height: 1.55; letter-spacing: 0.03em;
  display: flex; align-items: baseline; gap: 10px;
}
.chapter h2 .no { font-family: 'Zen Maru Gothic', sans-serif; font-size: 12px; color: var(--accent); letter-spacing: 0.12em; }
.chapter p { margin-top: 14px; font-size: 15.5px; }

/* 写真 */
.photos { margin-top: 18px; display: grid; gap: 10px; }
.photos.cols-2 { grid-template-columns: 1fr 1fr; }
.photos.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
figure { position: relative; }
.photo-link { display: block; border-radius: 10px; overflow: hidden; background: var(--sand); position: relative; }
.photo-link img { aspect-ratio: 4 / 3; object-fit: cover; transition: transform .4s ease; }
.photo-link:hover img { transform: scale(1.02); }
.photo-no {
  position: absolute; right: 8px; bottom: 8px;
  font-size: 11px; font-weight: 700; color: #fff;
  background: rgba(44,44,44,0.55); padding: 3px 8px; border-radius: 999px;
}
figcaption { font-size: 12.5px; color: var(--bark); margin-top: 6px; line-height: 1.7; }
.placeholder {
  aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center;
  color: var(--bark); font-size: 12px;
  background: repeating-linear-gradient(45deg, #EFE9DD, #EFE9DD 10px, #F5F0E6 10px, #F5F0E6 20px);
}

/* 引用（子どもの言葉など） */
.voice {
  margin-top: 18px; padding: 14px 18px;
  background: var(--white); border-radius: var(--radius);
  border-left: 4px solid var(--moss);
  font-family: 'Zen Maru Gothic', sans-serif; font-size: 16px; font-weight: 500;
}

/* カメラマンから */
.note {
  margin-top: 56px; padding: 22px 20px;
  background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow);
}
.note-title { font-size: 12px; letter-spacing: 0.16em; color: var(--forest); font-weight: 700; }
.note p { margin-top: 10px; font-size: 15px; }
.note .sign { margin-top: 12px; text-align: right; font-size: 13px; color: var(--bark); }
.sign-only { margin-top: 48px; text-align: right; font-size: 13px; color: var(--bark); }

/* 写真を選ぶ導線 */
.cta {
  margin-top: 36px; text-align: center; padding: 26px 18px;
  background: #EDF3ED; border-radius: var(--radius);
}
.cta p { font-size: 14px; }
.cta-btn {
  display: inline-block; margin-top: 14px;
  background: var(--forest); color: #fff; text-decoration: none; font-weight: 700;
  padding: 13px 28px; border-radius: 999px; font-size: 15px;
  box-shadow: 0 6px 18px rgba(74,122,90,0.3);
}
.cta small { display: block; margin-top: 10px; font-size: 12px; color: var(--bark); }

footer { text-align: center; padding: 24px 16px 40px; font-size: 12px; color: var(--bark); }

/* ログイン前のゲート */
.gate { max-width: 460px; margin: 48px auto; padding: 28px 22px; text-align: center; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); }
.gate .eyebrow { margin-top: 0; }
.gate h1 { font-size: 22px; margin-top: 8px; }
.gate p { margin-top: 14px; font-size: 14px; color: var(--bark); }
.gate .cta-btn { margin-top: 18px; }

figure.wide { grid-column: 1 / -1; }
.photo-no { max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 480px) {
  .photos.cols-3 { grid-template-columns: 1fr 1fr; }
}

/* レイアウトブロック（章ごとに組み方を変える） */
.blocks { margin-top: 20px; display: grid; gap: 16px; }
.blk { display: grid; gap: 10px; }
.blk-pair { grid-template-columns: 1fr 1fr; align-items: stretch; }
/* fill: 隣の写真の高さに合わせて埋める（余白を作らない） */
figure.fill { position: relative; min-height: 100%; }
figure.fill .photo-link { position: absolute; inset: 0; }
figure.fill .photo-link img { height: 100%; aspect-ratio: auto; }
.blk-pair.s75 { grid-template-columns: 7fr 5fr; }
.blk-pair.s57 { grid-template-columns: 5fr 7fr; }
.blk-mosaic { grid-template-columns: 2fr 1fr; align-items: stretch; }
.blk-mosaic.left { grid-template-columns: 1fr 2fr; }
.blk-mosaic.left .big { order: 2; }
.blk-mosaic .small { display: grid; gap: 10px; grid-template-rows: 1fr 1fr; }
.blk-mosaic .small .photo-link, .blk-mosaic .small figure { height: 100%; }
.blk-mosaic .small .photo-link img { height: 100%; aspect-ratio: auto; }
.blk-offset { grid-template-columns: 58fr 42fr; align-items: start; }
.blk-offset figure:last-child { margin-top: 22%; }
.blk-strip { grid-template-columns: repeat(3, 1fr); }
.blk-bleed { width: min(100vw - 24px, 820px); margin-left: calc(50% - min(100vw - 24px, 820px) / 2); }
.cap { font-size: 12.5px; color: var(--bark); letter-spacing: 0.04em; line-height: 1.7; margin-top: -4px; }
.cap::before { content: '— '; color: var(--accent); }
figure.ar-32 .photo-link img { aspect-ratio: 3 / 2; }
figure.ar-43 .photo-link img { aspect-ratio: 4 / 3; }
figure.ar-11 .photo-link img { aspect-ratio: 1 / 1; }
figure.ar-34 .photo-link img { aspect-ratio: 3 / 4; }
figure.ar-45 .photo-link img { aspect-ratio: 4 / 5; }
@media (max-width: 560px) {
  .blk-pair, .blk-pair.s75, .blk-pair.s57 { grid-template-columns: 1fr 1fr; }
  .blk-pair figure .photo-link img { aspect-ratio: 1 / 1; }
  .blk-pair figure.fill .photo-link img { aspect-ratio: auto; }
  .blk-offset { grid-template-columns: 1fr; }
  .blk-offset figure:last-child { margin-top: 0; width: 72%; justify-self: end; }
  .blk-mosaic, .blk-mosaic.left { grid-template-columns: 1fr; }
  .blk-mosaic.left .big { order: 0; }
  .blk-mosaic .small { grid-template-rows: none; grid-template-columns: 1fr 1fr; }
  .blk-mosaic .small .photo-link img { height: auto; aspect-ratio: 1 / 1; }
}
</style>
</head>

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function imgUrl(id, w) {
  return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 1200);
}
// ログイン中のイベント（ギャラリーと同じ sessionStorage を参照）
function currentEventId() {
  try {
    const s = JSON.parse(sessionStorage.getItem('osanpo_session') || 'null');
    if (s && s.event && s.expires > Date.now()) return String(s.event.id);
  } catch (e) {}
  return '';
}
const CURRENT = currentEventId();

  const inner = '<img src="' + imgUrl(p.id, w) + '" alt="芋掘り・栗拾いの写真（' + esc(label) + '）" loading="lazy" referrerpolicy="no-referrer"' + style + '>'
    + '<span class="photo-no">' + esc(label) + '</span>';
  // ログイン中のクラスの写真なら、タップでギャラリーのその写真を開く
  if (ev.id && ev.id === CURRENT) {
    return '<a class="photo-link" href="./#photo-' + esc(p.no) + '" aria-label="この写真をギャラリーで見る">' + inner + '</a>';
  }
  return '<div class="photo-link">' + inner + '</div>';
}
// 写真ブロック: wide / bleed / pair(split 75|57) / mosaic(side) / offset / strip / cap
function fig(p, w, extra) {
  return '<figure class="' + (extra || '') + (p.ar ? ' ar-' + p.ar : '') + (p.fill ? ' fill' : '') + '">' + photoHtml(p, w) + '</figure>';
}
function renderBlocks(blocks) {
  let h = '<div class="blocks">';
  blocks.forEach(b => {
    switch (b.t) {
      case 'wide':   h += '<div class="blk blk-wide">' + fig(Object.assign({ ar: '32' }, b.p), 1400) + '</div>'; break;
      case 'bleed':  h += '<div class="blk blk-bleed">' + fig(Object.assign({ ar: '32' }, b.p), 1600) + '</div>'; break;
      case 'pair':   h += '<div class="blk blk-pair' + (b.split ? ' s' + b.split : '') + '">' + fig(b.a, 900) + fig(b.b, 900) + '</div>'; break;
      case 'offset': h += '<div class="blk blk-offset">' + fig(b.a, 1000) + fig(b.b, 800) + '</div>'; break;
      case 'mosaic': h += '<div class="blk blk-mosaic' + (b.side === 'left' ? ' left' : '') + '">' + fig(b.big, 1100, 'big') + '<div class="small">' + b.small.map(p => fig(Object.assign({ ar: '11' }, p), 700)).join('') + '</div></div>'; break;
      case 'strip':  h += '<div class="blk blk-strip">' + b.items.map(p => fig(Object.assign({ ar: '11' }, p), 700)).join('') + '</div>'; break;
      case 'cap':    h += '<div class="cap">' + esc(b.text) + '</div>'; break;
    }
  });
  return h + '</div>';
}
function paras(t, cls) {
  return (Array.isArray(t) ? t : [t]).filter(Boolean).map(x => '<p' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(x) + '</p>').join('');
}
function render() {
  let h = '<section class="hero">';
  h += '<div class="hero-photo' + (BLOG.hero.ar ? ' ar-' + BLOG.hero.ar : '') + '">' + photoHtml(BLOG.hero, 1600) + '</div>';
  h += '<div class="eyebrow">' + esc(BLOG.eyebrow) + '</div>';
  h += '<h1>' + esc(BLOG.title) + '</h1>';
  h += '<div class="meta">' + esc(BLOG.meta) + '</div>';
  h += '</section><article>';
  h += paras(BLOG.lead, 'lead');
  BLOG.chapters.forEach((c, i) => {
    h += '<section class="chapter">';
    h += '<h2><span class="no">' + String(i + 1).padStart(2, '0') + '</span>' + esc(c.heading) + '</h2>';
    h += paras(c.text);
    if (c.blocks && c.blocks.length) h += renderBlocks(c.blocks);
    if (c.photos && c.photos.length) {
      h += '<div class="photos cols-' + (c.cols || 1) + '">';
      c.photos.forEach(p => {
        h += '<figure' + (p.wide ? ' class="wide"' : '') + '>' + photoHtml(p, (c.cols > 1 && !p.wide) ? 800 : 1400) + '</figure>';
      });
      h += '</div>';
    }
    if (c.voice) h += '<div class="voice">' + esc(c.voice) + '</div>';
    h += '</section>';
  });
  if (BLOG.note) {
    h += '<div class="note"><div class="note-title">カメラマンより</div><p>' + esc(BLOG.note) + '</p><div class="sign">' + esc(BLOG.sign) + '</div></div>';
  } else if (BLOG.sign) {
    h += '<div class="sign-only">' + esc(BLOG.sign) + '</div>';
  }
  h += '<div class="cta"><p>この日の写真は、ギャラリーから<br>1枚ずつ選んでお求めいただけます。</p>'
     + '<a class="cta-btn" href="./">写真を選ぶ →</a>'
     + '<small>' + (CURRENT ? 'お子さまのクラスの写真は、タップするとギャラリーでその写真が開きます' : 'ギャラリーにログインしてから開くと、写真をタップしてそのまま選べます') + '</small></div>';
  h += '</article>';
  document.getElementById('app').innerHTML = h;
}
function renderGate() {
  const h = '<section class="gate">'
    + '<div class="eyebrow">' + esc(BLOG.eyebrow) + '</div>'
    + '<h1>' + esc(BLOG.title) + '</h1>'
    + '<p>この記事は、園の保護者の方に向けた PHOTO STORY です。<br>ギャラリーにログインすると表示されます。</p>'
    + '<a class="cta-btn" href="./?next=' + encodeURIComponent(location.pathname.split('/').pop() || 'blog-imohori-2026.html') + '">ギャラリーにログインする →</a>'
    + '<p style="font-size:12px;margin-top:14px">パスワードは園からのお知らせをご確認ください</p>'
    + '</section>';
  document.getElementById('app').innerHTML = h;
}
// ログイン中（かつ、この記事のクラス）のときだけ記事を表示する
const ALLOWED = Object.keys(EVENTS).some(k => EVENTS[k].id === CURRENT);
if (ALLOWED) render(); else renderGate();
</script>
